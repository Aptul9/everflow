# Paths are relative to this file.

[tickets]
enabled = false

[chats]
enabled = false

[db]
path = "data/everflow-v1.db"

[vault]
path = "C:/Users/Antonio/OneDrive/Documenti/Vault"

[opencode]
# Empty url: OpenChamber's own opencode server, through OpenChamber's local port with its UI password
# (desktopLocalPort, desktopUiPassword in ~/.config/openchamber/settings.json). A url here means a plain
# `opencode serve` with basic auth, password from EVERFLOW_OPENCODE_PASSWORD.
url = ""
directory = "C:/Users/Antonio/OneDrive/Documenti/Vault"
model = "meridian-everbright/claude-opus-5-5"

[triage]
# opencode provider ids, tried in order on a rate limit: base URL, key and headers are read from
# ~/.config/opencode/opencode.jsonc.
providers = ["meridian-everbright", "meridian-notarify"]
model = "claude-haiku-5-5"
tool_limit = 8
timeout_seconds = 120
min_confidence = 0.75
# Earlier messages of the same conversation sent with each batch, oldest first, with send times.
history_messages = 40

[windows]
# Seconds a conversation stays quiet before its batch runs. Floors from the design: chat 120, email 300.
outlook = 300
teams = 120
teamsrelay = 120
gchat = 120
gmail = 300

[start]
# Catch-up for a source with no cursor yet.
lookback_minutes = 0

[web]
port = 8789

[jobs]
triage_concurrency = 3
turn_concurrency = 4
lease_seconds = 120
renew_seconds = 30
backoff_initial_seconds = 10
backoff_max_seconds = 1800
backoff_jitter = 0.2
max_attempts = 5
max_recoveries = 2
dependency_failure_threshold = 3
collect_seconds = 10
sync_seconds = 300
heartbeat_seconds = 10
archive_hours = 24
reopen_days = 2
purge_days = 30
log_max_bytes = 10485760
log_files = 5

# Entrypoints resolve inside the explicitly selected completed source-only artifact.
# Sources remain off until guarded read-only acceptance supplies explicit source settings.
[sources.outlook]
enabled = false
entrypoint = "dist/watchers/outlook.js"
poll_seconds = 60

[sources.teams]
enabled = false
entrypoint = "dist/watchers/teams.js"
poll_seconds = 30
# An explicit profile is required. Cache and snapshot paths are everflow-owned beside the DB.

[sources.teamsrelay]
enabled = false
entrypoint = "dist/watchers/relay.js"
poll_seconds = 30
# Explicit host, data_dir and owner are required. Saved stores are read-only.

[sources.gchat]
enabled = false
entrypoint = "dist/watchers/gchat.js"
poll_seconds = 30
account = "antonio.maritato@ext.tecnomat.it"
self_id = "101370931929254618444"
topics = 200
# API renewal first; approved fallback uses saved Chrome profile minimized, without prompts.
browser_refresh = true
# Recent-topic coverage only. Source remains disabled until explicitly enabled.

[sources.gmail]
enabled = false
entrypoint = "dist/watchers/gmail.js"
poll_seconds = 60
account = "antonio.maritato@ext.tecnomat.it"
# Uses installed gws and existing Gmail authentication. Inbox and Sent, read-only.

# A receiving account names its client; for an account that is no client's (bandpey), the sender
# domains and the addresses quoted in the text decide. Keywords pick the client's vault notes.
# role (optional) tells triage what is Antonio's work at the client; anything outside it is skipped.
[clients.msc]
domains = ["msccruises.com"]
keywords = ["msc"]
role = "One of the Cyber Security Architects (CSA) at MSC Cruises: reviews project teams' Flows Tables and gives the CSA security position. The CSA queue is shared with Massimo Stillitano; Simonetta Viola or Simone Fortin assigns each review. His work: the reviews assigned to him (one page each under 02_Areas/msc/tickets/, cards on 02_Areas/msc/tickets-board.md); messages on those reviews that ask for the CSA position, a security decision or a Flows Table check, even when sent to all; anything put to him by name. Not his: Massimo's reviews and escalations; asks to the CSA or Cyber teams as a group (Ciao a tutti, Dear all, DL Requests) that are not one of his reviews and do not name him; work other MSC teams or vendors carry out, even on his review threads: Cloud Team and IT Cloud requests, firewall and network rules, DNS, PKI certificate signing, RBAC and Key Vault grants, App Service and Entra setup, Proofpoint, Zscaler, Defense, Sensible, GRC; status updates and chases between other people."

