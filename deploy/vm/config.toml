# Everflow instance on oe-vm (Contabo), run by aptul4ever. Installed by deploy/vm/receive.sh into ~/everflow/instance on every
# deploy: change it here, not on the VM. Paths are relative to the instance folder.
# Clients move here one at a time; a client's accounts must leave the laptop instance's source lists when they are added here.

[tickets]
enabled = true

[chats]
enabled = true

[db]
path = "everflow.db"

[vault]
path = "/home/aptul4ever/Vault"
guide = "PARA layout. 01_Projects/<slug>.md is one page per project or client engagement with Status, Log, Blockers and Traps; slugs are kebab-case and usually start with the client (tesco-..., bip-..., npo); some clients have a subfolder (01_Projects/roar/, 01_Projects/serco/). 01_Projects/Board.md is the task board. 02_Areas/<client>/ holds ongoing client know-how (bip, npo, tesco, msc, roar, serco, notarify, avvale, vection, tecnomat, bbva, q8) and 02_Areas/Decisions/YYYY-MM-DD-<slug>.md holds decisions. 03_Resources is reference material, 04_Archive closed work, 05_Daily/YYYY-MM-DD.md daily activity, 99_Inbox unfiled captures. Search client names, email domains, people, system names and ticket keys; one or two words per query work best. Prefer 01_Projects and 02_Areas notes for kb_notes."

[opencode]
# The OpenChamber web server of aptul4ever (openchamber.service); OPENCHAMBER_UI_PASSWORD comes from its service.env
url = ""
openchamber_port = 3000
directory = "/home/aptul4ever/everflow-chats"
model = "meridian-auto/claude-opus-5-5"

[triage]
# Routes from ~/.config/opencode/opencode.jsonc, the laptop's file mirrored by instructions setup/oracle-vm/push-opencode.ps1;
# same order as the laptop instance
providers = ["meridian-everbright", "meridian-notarify", "meridian-roar"]
model = "claude-haiku-5-5"

[start]
lookback_minutes = 0

[web]
port = 8789
# Caddy (deploy/vm/Caddyfile) serves the page here over TLS; the daemon asks for its own sign-in under this host and stays on 127.0.0.1
public_origin = "https://everflow.217-76-49-98.sslip.io"

[oe]
# The OE Copilot endpoint every OE source reads through; oe.token (mode 600, next to this file) holds its read-only token
# EVERFLOW_TOKEN. Not deployed by the pipeline: the file stays in ~/everflow/instance across deploys.
url = "https://teams.everbright.it/communication"
token_file = "oe.token"

[sources.outlook]
enabled = false

[sources.teams]
enabled = false

[sources.gchat]
enabled = false

[sources.gmail]
enabled = false

# Clients here: roar (2026-11-15), notarify and npo (2026-11-15); their accounts are off the laptop instance's lists.
# The relay slots read are those of the Teams relay administrator the endpoint acts for.
[sources.teamsrelay]
enabled = true
poll_seconds = 30
accounts = ["antonio.maritato@roarinc.com", "antonio.maritato@notarify.io", "antonio.maritato@nposervices.com"]

[sources.oemail]
enabled = true
poll_seconds = 60
accounts = ["antonio.maritato@roarinc.com", "antonio.maritato@notarify.io", "antonio.maritato@nposervices.com"]

# Client settings as on the laptop instance; directory = the VM folder their chats open in
[clients.roar]
accounts = ["antonio.maritato@roarinc.com"]
domains = ["roarinc.com"]
keywords = ["roar"]
directory = "/home/aptul4ever/everflow-chats/roar"

[clients.notarify]
accounts = ["antonio.maritato@notarify.io"]
domains = ["notarify.io"]
keywords = ["notarify", "notaridrive", "coin"]
directory = "/home/aptul4ever/everflow-chats/notarify"

[clients.npo]
domains = ["nposervices.com", "iveco.com"]
keywords = ["npo", "iveco"]
directory = "/home/aptul4ever/everflow-chats/npo"
